[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "reusable_datatypes"
description = "Simple utility package containing useful reusable datatypes."
version = "0.0.2"
authors = [
  {name = "Milan Kundra", email = "kundra.milan@uk.sika.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy >= 1.0.0"
]

[tool.distutils.bdist_wheel]
universal = true
